name: DFSTL CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validation:
    name: Phase 11 ACL Regression
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        continue-on-error: true

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Phase 11 ACL analyzer smoke test
        shell: pwsh
        run: |
          $Describe = cargo run -p dfstl-cli -- describe
          $Describe
          if ($Describe -notmatch "phase: 11") { throw "Phase marker missing" }
          if ($Describe -notmatch "windows-acl-analysis: available") { throw "ACL capability missing" }

          $List = cargo run -p dfstl-cli -- list
          $List
          if ($List -notmatch "ACL-WINDOWS-001") { throw "ACL test missing" }

          cargo test -p dfstl-core broad_write_is_reported
          if ($LASTEXITCODE -ne 0) { throw "ACL broad-write regression failed" }

          cargo test -p dfstl-core restricted_sensitive_acl_is_clean
          if ($LASTEXITCODE -ne 0) { throw "ACL restricted regression failed" }

          $Root = Join-Path $PWD "ci-phase11"
          New-Item -ItemType Directory -Force -Path $Root | Out-Null
          $Snapshot = Join-Path $Root "clean.tsv"
          $Tab = [char]9
          @(
            ("C:\Lab\agent\agent-session.key" + $Tab + "OWNER" + $Tab + "OWNER" + $Tab + "Allow" + $Tab + "FullControl" + $Tab + "false"),
            ("C:\Lab\agent\agent-session.key" + $Tab + "OWNER" + $Tab + "NT AUTHORITY\SYSTEM" + $Tab + "Allow" + $Tab + "FullControl" + $Tab + "false")
          ) | Set-Content -LiteralPath $Snapshot -Encoding UTF8

          cargo run -p dfstl-cli -- windows-acl analyze --input $Snapshot --output (Join-Path $Root "analysis") --lab-ack --json
          if ($LASTEXITCODE -ne 0) { throw "ACL analyzer clean fixture failed" }

      - name: LabOnly runner regression
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $Root = Join-Path $PWD "ci-phase11"
          New-Item -ItemType Directory -Force -Path $Root | Out-Null
          cargo run -p dfstl-cli -- run --lab-ack --output (Join-Path $Root "lab-runner")
          if ($LASTEXITCODE -ne 0) { throw "LabOnly runner regression failed" }
