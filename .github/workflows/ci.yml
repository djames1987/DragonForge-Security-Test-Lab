name: DFSTL CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validation:
    name: Phase 10 Failure Resource Regression
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        continue-on-error: true

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Phase 10 failure/resource smoke test
        shell: pwsh
        run: |
          $Describe = cargo run -p dfstl-cli -- describe
          $Describe
          if ($Describe -notmatch "phase: 10") { throw "Phase marker missing" }
          if ($Describe -notmatch "failure-injection-lab: available") { throw "Failure capability missing" }

          $List = cargo run -p dfstl-cli -- list
          $List
          if ($List -notmatch "FAULT-INJECT-001") { throw "FAULT injection test missing" }
          if ($List -notmatch "RESOURCE-LAB-001") { throw "RESOURCE test missing" }
          if ($List -notmatch "FAULT-KILL-001") { throw "FAULT kill test missing" }

          cargo test -p dfstl-core failure_injection_matrix_preserves_recovery_invariants
          if ($LASTEXITCODE -ne 0) { throw "Failure injection regression failed" }

          cargo test -p dfstl-core resource_stress_is_bounded_and_completes
          if ($LASTEXITCODE -ne 0) { throw "Resource stress regression failed" }

          $Root = Join-Path $PWD "ci-phase10"
          New-Item -ItemType Directory -Force -Path $Root | Out-Null
          cargo run -p dfstl-cli -- failure inject --root (Join-Path $Root "lab") --output (Join-Path $Root "failure") --controlled --json
          if ($LASTEXITCODE -ne 0) { throw "Failure injection CLI failed" }

          cargo run -p dfstl-cli -- failure resource --output (Join-Path $Root "resource") --lab-ack --cpu 2000 --memory-bytes 65536 --sockets 4 --json
          if ($LASTEXITCODE -ne 0) { throw "Resource stress CLI failed" }

          cargo run -p dfstl-cli -- failure process-termination --lab-ack --json
          if ($LASTEXITCODE -ne 0) { throw "Self-child termination failed" }

          cargo run -p dfstl-cli -- run --lab-ack --output (Join-Path $Root "lab-runner")
          if ($LASTEXITCODE -ne 0) { throw "LabOnly runner regression failed" }
