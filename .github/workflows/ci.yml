name: DFSTL CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validation:
    name: Phase 4 Encrypted Format Mutation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        continue-on-error: true

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Phase 4 CLI smoke test
        shell: pwsh
        run: |
          $Describe = cargo run -p dfstl-cli -- describe
          $Describe
          if ($Describe -notmatch "phase: 4") { throw "Phase marker missing" }
          if ($Describe -notmatch "encrypted-format-mutation: available") { throw "Mutation capability missing" }
          if ($Describe -notmatch "mutation-safety-class: controlled") { throw "Controlled safety marker missing" }

          $List = cargo run -p dfstl-cli -- list
          $List
          if ($List -notmatch "PARSER-MUTATE-001") { throw "Phase 4 mutation test missing" }

          New-Item -ItemType Directory -Force -Path ci-fixtures | Out-Null
          Set-Content -LiteralPath ci-fixtures/pm.dfvault -NoNewline -Value '{"version":1,"vault_id":"ci","items":[]}'

          cargo run -p dfstl-cli -- format mutate --format password-manager --input ci-fixtures/pm.dfvault --output ci-corpus --controlled --json
          if ($LASTEXITCODE -ne 0) { throw "Controlled mutation failed" }

          $Corpus = Get-Content ci-corpus/corpus.json -Raw | ConvertFrom-Json
          if ($Corpus.schema_version -ne 1) { throw "Unexpected corpus schema" }
          if ($Corpus.cases.Count -ne 8) { throw "Unexpected Password Manager mutation count" }

          cargo run -p dfstl-cli -- run --output ci-safe-results
          if ($LASTEXITCODE -ne 0) { throw "Safe runner regression failed" }

          cargo run -p dfstl-cli -- run --controlled --output ci-controlled-results
          if ($LASTEXITCODE -ne 0) { throw "Controlled runner regression failed" }
