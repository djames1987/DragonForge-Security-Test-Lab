name: DFSTL CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validation:
    name: Phase 9 Secret Leak Regression
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        continue-on-error: true

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Phase 9 secret leak smoke test
        shell: pwsh
        run: |
          $Describe = cargo run -p dfstl-cli -- describe
          $Describe
          if ($Describe -notmatch "phase: 9") { throw "Phase marker missing" }
          if ($Describe -notmatch "synthetic-secret-sentinel-scan: available") { throw "Secret leak capability missing" }

          $List = cargo run -p dfstl-cli -- list
          $List
          if ($List -notmatch "LEAK-SENTINEL-001") { throw "LEAK test missing" }
          if ($List -notmatch "MEMORY-LIFE-001") { throw "MEMORY test missing" }

          cargo test -p dfstl-core scanner_finds_raw_hex_and_base64_without_emitting_secret_value
          if ($LASTEXITCODE -ne 0) { throw "Secret representation regression failed" }

          cargo test -p dfstl-core synthetic_memory_buffer_is_cleared_in_place
          if ($LASTEXITCODE -ne 0) { throw "Memory lifecycle regression failed" }

          $Root = Join-Path $PWD "ci-phase9"
          $Clean = Join-Path $Root "clean"
          New-Item -ItemType Directory -Force -Path $Clean | Out-Null
          [IO.File]::WriteAllText((Join-Path $Clean "safe.log"), "token=[REDACTED]")

          cargo run -p dfstl-cli -- secret-leak scan --root $Clean --sentinels corpus/seeds/phase9-sentinels.txt --output (Join-Path $Root "evidence") --controlled --json
          if ($LASTEXITCODE -ne 0) { throw "Clean secret leak smoke scan failed" }

          cargo run -p dfstl-cli -- run --controlled --output (Join-Path $Root "controlled")
          if ($LASTEXITCODE -ne 0) { throw "Controlled runner regression failed" }

          cargo run -p dfstl-cli -- run --lab-ack --output (Join-Path $Root "lab")
          if ($LASTEXITCODE -ne 0) { throw "LabOnly runner regression failed" }
