name: DFSTL CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validation:
    name: Phase 6 Filesystem Lab
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        continue-on-error: true

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Phase 6 filesystem smoke test
        shell: pwsh
        run: |
          $Describe = cargo run -p dfstl-cli -- describe
          $Describe
          if ($Describe -notmatch "phase: 6") { throw "Phase marker missing" }
          if ($Describe -notmatch "filesystem-lab: available") { throw "Filesystem lab capability missing" }
          if ($Describe -notmatch "filesystem-lab-safety-class: lab-only") { throw "LabOnly safety marker missing" }

          $List = cargo run -p dfstl-cli -- list
          $List
          if ($List -notmatch "FS-LAB-001") { throw "Phase 6 filesystem test missing" }

          $Corpus = cargo run -p dfstl-cli -- filesystem path-corpus
          $Corpus
          if ($LASTEXITCODE -ne 0) { throw "Path corpus failed" }

          New-Item -ItemType Directory -Force -Path ci-phase6 | Out-Null
          $LabRoot = Join-Path $PWD "ci-phase6/lab"
          cargo run -p dfstl-cli -- filesystem lab --root $LabRoot --lab-ack --json
          if ($LASTEXITCODE -ne 0) { throw "Filesystem lab failed" }

          $Report = Get-Content (Join-Path $LabRoot "filesystem-lab.json") -Raw | ConvertFrom-Json
          if ($Report.schema_version -ne 1) { throw "Unexpected filesystem lab schema" }
          if ($Report.has_failures) { throw "Filesystem lab reported a failure" }

          cargo run -p dfstl-cli -- run --output ci-safe-results
          if ($LASTEXITCODE -ne 0) { throw "Safe runner regression failed" }

          cargo run -p dfstl-cli -- run --controlled --output ci-controlled-results
          if ($LASTEXITCODE -ne 0) { throw "Controlled runner regression failed" }

          cargo run -p dfstl-cli -- run --lab-ack --output ci-lab-results
          if ($LASTEXITCODE -ne 0) { throw "LabOnly runner regression failed" }
