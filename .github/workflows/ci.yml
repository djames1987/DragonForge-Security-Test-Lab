name: DFSTL CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validation:
    name: Phase 5 Agent Harness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        continue-on-error: true

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Phase 5 Agent harness smoke test
        shell: pwsh
        run: |
          $Describe = cargo run -p dfstl-cli -- describe
          $Describe
          if ($Describe -notmatch "phase: 5") { throw "Phase marker missing" }
          if ($Describe -notmatch "agent-attack-harness: available") { throw "Agent harness capability missing" }
          if ($Describe -notmatch "agent-harness-safety-class: controlled") { throw "Agent safety marker missing" }

          $List = cargo run -p dfstl-cli -- list
          $List
          if ($List -notmatch "IPC-AGENT-001") { throw "Phase 5 Agent test missing" }

          cargo test -p dfstl-core loopback_attack_harness_exercises_expected_matrix
          if ($LASTEXITCODE -ne 0) { throw "Loopback Agent harness regression failed" }

          $Runtime = Join-Path $PWD "ci-agent-runtime"
          New-Item -ItemType Directory -Force -Path $Runtime | Out-Null
          @'
{"format_version":1,"protocol_major":1,"protocol_minor":1,"port":6553,"pid":7,"started_at_ms":1}
'@ | Set-Content -LiteralPath (Join-Path $Runtime "agent-runtime.json") -NoNewline
          [IO.File]::WriteAllText(
            (Join-Path $Runtime "agent-session.key"),
            ([Convert]::ToBase64String([byte[]](1..32 | ForEach-Object { 9 })) + [Environment]::NewLine)
          )

          cargo run -p dfstl-cli -- agent runtime-mutate --runtime-dir $Runtime --output ci-agent-mutations --controlled --json
          if ($LASTEXITCODE -ne 0) { throw "Runtime mutation smoke test failed" }

          $Corpus = Get-Content ci-agent-mutations/runtime-mutations.json -Raw | ConvertFrom-Json
          if ($Corpus.schema_version -ne 1) { throw "Unexpected runtime mutation schema" }
          if ($Corpus.cases.Count -ne 8) { throw "Unexpected runtime mutation case count" }

          cargo run -p dfstl-cli -- run --output ci-safe-results
          if ($LASTEXITCODE -ne 0) { throw "Safe runner regression failed" }

          cargo run -p dfstl-cli -- run --controlled --output ci-controlled-results
          if ($LASTEXITCODE -ne 0) { throw "Controlled runner regression failed" }
