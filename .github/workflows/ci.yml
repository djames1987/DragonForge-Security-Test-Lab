name: DFSTL CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validation:
    name: Phase 3 Static Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        continue-on-error: true

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Phase 3 CLI smoke test
        shell: pwsh
        run: |
          $Describe = cargo run -p dfstl-cli -- describe
          $Describe
          if ($Describe -notmatch "phase: 3") { throw "Phase marker missing" }
          if ($Describe -notmatch "static-source-scan: available") { throw "Static scan capability missing" }
          if ($Describe -notmatch "spdx-sbom: available") { throw "SBOM capability missing" }

          $List = cargo run -p dfstl-cli -- list
          $List
          if ($List -notmatch "STATIC-SUPPLY-001") { throw "Phase 3 self-check missing" }

          $Root = Join-Path $PWD "ci-source"
          $WorkflowDir = Join-Path $Root ".github/workflows"
          New-Item -ItemType Directory -Force -Path $WorkflowDir | Out-Null

          @'
[package]
name = "ci-fixture"
version = "0.1.0"
edition = "2024"
'@ | Set-Content -LiteralPath (Join-Path $Root "Cargo.toml")

          @'
version = 4

[[package]]
name = "ci-fixture"
version = "0.1.0"
'@ | Set-Content -LiteralPath (Join-Path $Root "Cargo.lock")

          @'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@0123456789abcdef0123456789abcdef01234567
'@ | Set-Content -LiteralPath (Join-Path $WorkflowDir "ci.yml")

          cargo run -p dfstl-cli -- source scan --source $Root --output ci-static --json
          if ($LASTEXITCODE -ne 0) { throw "Built-in static scan failed" }

          $Report = Get-Content ci-static/static-scan.json -Raw | ConvertFrom-Json
          if ($Report.schema_version -ne 1) { throw "Unexpected static scan schema" }
          if ($Report.counts.high_findings -ne 0) { throw "Unexpected high finding" }

          $Sbom = Get-Content ci-static/sbom.spdx.json -Raw | ConvertFrom-Json
          if ($Sbom.spdxVersion -ne "SPDX-2.3") { throw "Unexpected SBOM version" }

          cargo run -p dfstl-cli -- run --output ci-results
          if ($LASTEXITCODE -ne 0) { throw "Safe runner regression failed" }
