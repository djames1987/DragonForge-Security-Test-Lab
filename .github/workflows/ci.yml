name: DFSTL CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validation:
    name: Phase 8 Fuzz Regression
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        continue-on-error: true

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Phase 8 deterministic fuzz smoke test
        shell: pwsh
        run: |
          $Describe = cargo run -p dfstl-cli -- describe
          $Describe
          if ($Describe -notmatch "phase: 8") { throw "Phase marker missing" }
          if ($Describe -notmatch "deterministic-fuzz-corpus: available") { throw "Fuzz corpus capability missing" }

          $List = cargo run -p dfstl-cli -- list
          $List
          if ($List -notmatch "FUZZ-CORPUS-001") { throw "Phase 8 fuzz test missing" }

          cargo test -p dfstl-core deterministic_corpus_repeats_for_same_seed
          if ($LASTEXITCODE -ne 0) { throw "Deterministic corpus regression failed" }

          cargo test -p dfstl-core minimizer_preserves_oracle_and_reduces_input
          if ($LASTEXITCODE -ne 0) { throw "Minimizer regression failed" }

          $Root = Join-Path $PWD "ci-phase8"
          New-Item -ItemType Directory -Force -Path $Root | Out-Null
          cargo run -p dfstl-cli -- fuzz corpus --target agent-json --input corpus/seeds/agent-json.json --output (Join-Path $Root "corpus") --controlled --seed 42 --count 24 --json
          if ($LASTEXITCODE -ne 0) { throw "Fuzz corpus CLI failed" }

          $Corpus = Get-Content (Join-Path $Root "corpus/corpus.json") -Raw | ConvertFrom-Json
          if ($Corpus.schema_version -ne 1) { throw "Unexpected fuzz corpus schema" }
          if ($Corpus.cases.Count -ne 24) { throw "Unexpected fuzz corpus case count" }

          cargo run -p dfstl-cli -- run --controlled --output (Join-Path $Root "controlled")
          if ($LASTEXITCODE -ne 0) { throw "Controlled runner regression failed" }
