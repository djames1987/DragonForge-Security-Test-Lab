name: DFSTL CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validation:
    name: Phase 2 Target Discovery
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        continue-on-error: true

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Phase 2 CLI smoke test
        shell: pwsh
        run: |
          $Describe = cargo run -p dfstl-cli -- describe
          $Describe
          if ($Describe -notmatch "phase: 2") { throw "Phase marker missing" }
          if ($Describe -notmatch "expected-suite-executables: 11") { throw "Package contract mismatch" }

          $List = cargo run -p dfstl-cli -- list
          $List
          if ($List -notmatch "STATIC-TARGET-001") { throw "Phase 2 self-check missing" }

          $Root = Join-Path $PWD "ci-target"
          New-Item -ItemType Directory -Force -Path $Root | Out-Null
          $Names = @(
            "dragonforge-desktop.exe",
            "dragonforge-security-center.exe",
            "dragonforge-file-vault.exe",
            "dragonforge-authenticator.exe",
            "dragonforge-security-scanner.exe",
            "dragonforge-integrity-monitor.exe",
            "dragonforge-network-guard.exe",
            "dragonforge-backup-recovery.exe",
            "dragonforge-secure-share.exe",
            "dragonforge-agent.exe",
            "dragonforge-privileged-service.exe"
          )
          foreach ($Name in $Names) {
            Set-Content -LiteralPath (Join-Path $Root $Name) -Value $Name -NoNewline
          }

          $Json = cargo run -p dfstl-cli -- target inspect --target $Root --json
          if ($LASTEXITCODE -ne 0) { throw "Target inspection failed" }
          $Report = $Json | ConvertFrom-Json
          if (-not $Report.complete) { throw "Synthetic target was not complete" }
          if ($Report.executables.Count -ne 11) { throw "Unexpected executable count" }

          cargo run -p dfstl-cli -- run --output ci-results
          if ($LASTEXITCODE -ne 0) { throw "Safe runner regression failed" }
