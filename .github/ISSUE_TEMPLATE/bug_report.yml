name: Bug report
description: Report a reproducible non-security DFSTL defect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Use synthetic data only. Do not include credentials, tokens, keys, production secrets, personal data, sensitive exploit details, or evidence from systems you are not authorized to test. Use SECURITY.md for vulnerabilities.
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: dropdown
    id: safety
    attributes:
      label: Safety class
      options: [Safe, Controlled, Disruptive, LabOnly, Not applicable]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use synthetic fixtures and non-sensitive evidence only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
