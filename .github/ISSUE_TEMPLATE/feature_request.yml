name: Feature request
description: Suggest a defensive testing, evidence, or documentation improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Keep proposals defensive and bounded. Do not submit exploit payloads, offensive playbooks, source patches, or other copyrightable implementation material. Unsolicited code contributions are not currently accepted.
  - type: textarea
    id: usecase
    attributes:
      label: Defensive use case
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Desired behavior
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety boundaries
      description: Explain how the proposal should remain scoped and evidence-safe.
