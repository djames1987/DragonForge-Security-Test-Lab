# Example DFSTL lab configuration.
# The example remains documentation-only; Phase 2 target selection is explicit via CLI.

[lab]
name = "dragonforge-disposable-lab"
production = false
allow_remote_targets = false
allow_disruptive = false
allow_lab_only = false

[target]
# Equivalent to the explicit --target path used by Phase 2.
dragonforge_root = "C:\\DragonForge-Test-Build"

[evidence]
root = ".\\results"
retain_generated_corpus = false
